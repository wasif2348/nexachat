# NexaChat — Fly.io config
app = "nexachaty-app"
primary_region = "bom"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  SW_ENABLED = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
